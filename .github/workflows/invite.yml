name: Auto Invite Collaborator

on:
  repository_dispatch:
    types: [invite-user]

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - name: Invite Collaborator
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }} # (아래 참고)
          script: |
            const username = context.payload.client_payload.username;
            console.log(`Inviting user: ${username}`);
            
            try {
              await github.rest.repos.addCollaborator({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: username,
                permission: 'push'
              });
              console.log(`Successfully invited ${username}`);
            } catch (error) {
              core.setFailed(`Failed to invite ${username}: ${error.message}`);
            }